# PostgreSQL 16 + pgAdmin 4 para la Agencia de Viajes
# La primera vez que se levanta, ejecuta automáticamente los scripts de ./database
# (crear tablas, stored procedures, auth y datos de prueba).
services:
  postgres:
    image: postgres:16
    container_name: agencia_viajes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
      POSTGRES_DB: agencia_viajes_db
      TZ: America/Guatemala
    ports:
      - "5433:5432"   # 5433 para no chocar con otros PostgreSQL de prácticas
    volumes:
      - agencia_pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: agencia_viajes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agencia.com
      PGADMIN_DEFAULT_PASSWORD: Admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

volumes:
  agencia_pgdata:
